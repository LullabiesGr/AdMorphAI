# Run `shopify app config link` and select the EXISTING AdMorph AI app before deploy.
# The client_id is populated by Shopify CLI when linking the app.
client_id = ""
name = "AdMorph AI"
embedded = true
application_url = "https://admorphai.onrender.com"
handle = "admorph-ai"

[access_scopes]
scopes = "read_products,write_app_proxy"

[auth]
redirect_urls = ["https://admorphai.onrender.com/auth/callback"]

[webhooks]
api_version = "2026-10"
  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"
  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request"]
  uri = "/webhooks/customers/data_request"
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/redact"]
  uri = "/webhooks/customers/redact"
  [[webhooks.subscriptions]]
  compliance_topics = ["shop/redact"]
  uri = "/webhooks/shop/redact"

# Production protection: Shopify app dev must not replace the Render URL
# or the App Proxy URL with a temporary tunnel.
[build]
automatically_update_urls_on_dev = false

[app_proxy]
# Production backend endpoint. Changes here only take effect after `shopify app deploy`.
url = "https://admorphai.onrender.com/apps/admorph"
prefix = "apps"
subpath = "admorph"
