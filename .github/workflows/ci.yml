name: Verify AdMorph AI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHOPIFY_API_KEY: test_key
      SHOPIFY_API_SECRET: test_secret
      SHOPIFY_APP_URL: https://example.invalid
      SCOPES: read_products,write_app_proxy
      DATABASE_URL: postgresql://test:test@localhost:5432/admorph
      DIRECT_URL: postgresql://test:test@localhost:5432/admorph
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell script syntax
        shell: pwsh
        run: |
          $paths = @('scripts/check-shopify-config.ps1', 'scripts/repair-shopify-app-proxy.ps1', 'scripts/enable-experiments.ps1')
          foreach ($path in $paths) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Host $_.ToString() }
              throw "$path contains invalid PowerShell syntax."
            }
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
  windows-powershell-compat:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse scripts with Windows PowerShell 5.1 and reject non-ASCII
        shell: powershell
        run: |
          $paths = @('scripts/check-shopify-config.ps1', 'scripts/repair-shopify-app-proxy.ps1')
          foreach ($path in $paths) {
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $path).Path)
            if (@($bytes | Where-Object { $_ -ge 128 }).Count -gt 0) {
              throw "$path must be ASCII for compatibility with Windows PowerShell 5.1"
            }
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_.ToString() }
              throw "$path failed Windows PowerShell 5.1 parsing."
            }
          }
          Write-Host 'Both scripts parse successfully on Windows PowerShell 5.1.'
